[settings]
minimum_release_age = "0s"

[settings.self_update]
auto = true

[tool_alias]
proton-ge = "github:GloriousEggroll/proton-ge-custom"
proton-wineland = "github:nanomatters/proton-salkim"
proton-cachyos = "github:CachyOS/proton-cachyos"

[tools]
age = "latest"
claude-code = "latest"
fnox = "latest"
go = "latest"
node = "latest"
opencode = "latest"
pipx = "latest"
pnpm = "latest"
python = "latest"
rust = "latest"
typst = "latest"
usage = "latest"

[task_templates.install-proton-template]
vars = { latest_version = "{{ exec(command='mise latest ' ~ vars.tool ~ '@latest') | trim }}", dir_path = "$HOME/.steam/steam/compatibilitytools.d/{{ vars.internal_name }}", installed_version = "{{ exec(command=`[ -f ` ~ vars.dir_path ~ `/version ] && awk '{ print $2 }' ` ~ vars.dir_path ~ `/version || echo none`) | trim }}" }
skip_if = "[ {{ vars.latest_version }} = {{ vars.installed_version }} ]"
run = [
  "mise install-into -y {{ vars.tool }}@latest {{ vars.dir_path }}",
  "mise run rename-steam-compat-file '{{ vars.latest_version }}' '{{ vars.internal_name }}' '{{ vars.display_name }}' '{{ vars.dir_path }}'",
]

[tasks.rename-steam-compat-file]
description = ""
usage = '''
arg "<version>"
arg "<internal_name>"
arg "<display_name>"
arg "<dir_path>"
'''
run = '''
sed -i -E \
  -e "s/\"display_name\" \"(.*)\"/\"display_name\" \"$usage_display_name ($usage_version)\"/" \
  -e "s/\"(.*)\" \/\/ Internal/\"$usage_internal_name\" \/\/ Internal/" \
  $usage_dir_path/compatibilitytool.vdf
'''

[tasks.proton-wineland]
extends = "install-proton-template"
vars = { tool = "proton-wineland", internal_name = "proton-wineland-latest", display_name = "Wineland Proton Latest" }

[tasks.proton-ge]
extends = "install-proton-template"
vars = { tool = "proton-ge", internal_name = "proton-ge-latest", display_name = "GE Proton Latest" }

[tasks.proton-cachyos]
extends = "install-proton-template"
vars = { tool = "proton-cachyos", internal_name = "proton-cachyos-latest", display_name = "CachyOS Proton Latest" }

[tasks.proton-latest]
description = "Install all proton latest versions"
run = { tasks = ["proton-ge", "proton-cachyos", "proton-wineland"] }
